<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FieldSync | Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <script>if (!localStorage.getItem('fieldSyncSession')) window.location.href = 'auth.html';</script>
</head>
<body>
  <!-- Header (Same as index, but 'active' class is on Events) -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand-container"><div class="logo-icon"><img src="logo.png" alt="FieldSync Logo"></div><div class="brand-text"><p class="eyebrow"><i class="fa-solid fa-building"></i> Company</p><h1>FieldSync</h1></div></div>
      <nav class="nav-menu">
        <a href="index.html">Dashboard</a>
        <a href="capture.html">Data Capture</a>
        <a href="events.html" class="active">Progress Events</a>
        <a href="memory.html">Institutional Memory</a>
        <a href="audit.html">Audit Trail</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="welcome-row"><h2>Extracted Progress Events</h2></div>
    <div id="messageBox" class="message-box hidden"></div>
    <section class="panel full-panel">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Event ID</th><th>Reported Activity</th><th>Discipline</th><th>Type</th><th>Date</th><th>Confidence</th><th>Action</th></tr></thead>
          <tbody id="eventTableBody"><tr><td colspan="7" class="empty-cell">Loading events...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
